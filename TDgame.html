<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="wrapper">
        <div id="hpBar">
            <div id="hpBarColor"></div>
            <p id="hpNum">HP: 100</p>
        </div>
        <div id="info">
            <p id="killCount">Kills: 0</p>
            <p id="towerCount">Towers: 0</p>
        </div>
        <canvas id="main" width="800" height="500"></canvas>
        <div id="money">
            <p id="moneyCount">$: 10</p>
        </div>
        <div id="gameControls">
            <button id="tower1Button" onclick="selectTower1()">$10 Tower 1</button> <br>
            <button id="startButton" onclick="startGame()">Start Game</button>
        </div>

        <script src="script.js"></script>
    </div>
</body>
</html>
